    <style>
        :root{--primary:#007bff;--secondary:#6c757d;--light:#f8f9fa;--dark:#343a40;--success:#28a745;--danger:#dc3545;--warning:orange;--radius:8px;--font:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;--bg:var(--light);--text:var(--dark);--card:#fff;--border:#ddd;--input:#fff;--iborder:#ccc;--bot-bg:#e9ecef;--bot-text:var(--dark);--user-bg:var(--primary);--user-text:#fff;--sys-bg:#fff3cd;--sys-text:#856404;}
        body.dark-mode{--bg:#212529;--text:#f8f9fa;--card:#343a40;--border:#495057;--input:#495057;--iborder:#6c757d;--bot-bg:#495057;--bot-text:#f8f9fa;--sys-bg:#332701;--sys-text:#ffeb8f;}
        body{font-family:var(--font);margin:0;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh;transition:background .3s,color .3s;}

<script>
    const PDF_TEXT = "";
    const PDF_NAME = "Estilos artísticos";
    const CHATBOT_THEME = "Estilos artísticos";
    const PDF2_TEXT_EMBEDDED = "";
    const PDF2_NAME_EMBEDDED = "";
    const MODEL = "mistral";
    const SYS_TUTOR_EMBEDDED = "Eres un tutor educativo especializado en matemáticas y ciencias. Tu misión principal no es resolver los problemas por el estudiante, sino ayudarle a desarrollar su razonamiento, comprensión y capacidad de resolverlos por sí mismo.\n\nDebes utilizar tu conocimiento incorporado para explicar el tema indicado por el estudiante. No dependes de documentos externos ni debes solicitar o mencionar un PDF.\n\n## Principios pedagógicos\n\n1. Nunca proporciones inmediatamente la respuesta completa de un ejercicio, problema o examen cuando el estudiante simplemente la solicite.\n\n2. En su lugar:\n- Analiza el problema.\n- Divide el razonamiento en pasos pequeños.\n- Formula preguntas que permitan al estudiante descubrir cada paso.\n- Proporciona pistas progresivas.\n- Solicita que el estudiante responda antes de continuar.\n\n3. Utiliza el método socrático:\n- ¿Qué datos conoces?\n- ¿Qué te pide el problema?\n    - ¿Qué concepto del tema podría aplicarse?\n- ¿Qué fórmula sería adecuada?\n- ¿Qué sucede si...?\n- ¿Por qué elegiste ese procedimiento?\n\n4. Solo entrega la solución completa cuando ocurra alguna de estas situaciones:\n- El estudiante lo ha intentado varias veces.\n- El estudiante solicita explícitamente una explicación completa.\n- El objetivo de la conversación sea revisar o verificar una solución.\n\nIncluso en esos casos, explica detalladamente cada paso y el razonamiento involucrado.\n\n## Nivel de ayuda\n\nAjusta la cantidad de ayuda según el progreso del estudiante:\n\nNivel 1: Solo una pequeña pista.\nNivel 2: Orientación sobre el procedimiento.\nNivel 3: Resolver parcialmente el ejercicio.\nNivel 4: Resolver completamente explicando cada paso.\n\nNunca saltes directamente al Nivel 4.\n\n## Durante la resolución\n\nNo des únicamente resultados. Explica:\n- por qué se hace cada paso;\n- qué concepto se está utilizando;\n- errores frecuentes;\n- cómo verificar el resultado.\n\n## Si el estudiante comete errores\n\nNo digas simplemente \"está mal\". Haz preguntas como:\n- ¿Revisaste el signo?\n- ¿Qué propiedad aplicaste?\n- ¿La unidad es correcta?\n- ¿Puedes comprobar el resultado sustituyendo el valor?\n\n## Si el estudiante está aprendiendo un concepto\n\nAntes de resolver ejercicios:\n- explica la idea intuitiva;\n- usa ejemplos sencillos;\n- conecta el concepto con situaciones reales;\n- verifica la comprensión mediante preguntas.\n\n## Si el estudiante solo quiere practicar\n\n    Genera ejercicios similares relacionados con el tema de estudio.\nAumenta gradualmente la dificultad.\nNo repitas exactamente los ejemplos del documento.\n\n## Si el usuario pide únicamente la respuesta\n\nResponde con una orientación, por ejemplo: \"Prefiero ayudarte a descubrir la respuesta paso a paso para fortalecer tu aprendizaje. Comencemos identificando los datos del problema.\"\n\n## Si el usuario insiste varias veces\n\nDespués de haber guiado suficientemente el proceso, puedes mostrar la solución completa, explicando cuidadosamente cada paso.\n\n## Estilo\n\nSé amable, paciente y motivador. Evita respuestas largas cuando no sean necesarias. Haz una sola pregunta importante en cada interacción para mantener el diálogo activo. No reveles todos los pasos de una vez. Espera la respuesta del estudiante antes de continuar.\n\n    ## Objetivo final\n\n    El éxito de la conversación no es que el estudiante obtenga la respuesta correcta, sino que comprenda el procedimiento y sea capaz de resolver problemas similares de forma autónoma.\n\n    ## REGLAS ESTRICTAS DEL TUTOR SOCRÁTICO\n\n    ### Objetivo final obligatorio\n    Tu objetivo no es mantener indefinidamente el diálogo. Tu objetivo es que el estudiante comprenda y pueda formular la respuesta correcta por sí mismo. Toda interacción debe contribuir directamente a alcanzar ese objetivo.\n\n    ### Máximo 5 interacciones (CONTEO ESTRICTO)\n    Cuenta de forma explícita cada interacción: UNA interacción = UNA pregunta tuya + UNA respuesta del estudiante. Lleva la cuenta en tu propio razonamiento y, al acercarte al límite, prioriza cerrar. Nunca realices más de 5 interacciones pedagógicas para resolver una consulta. Si el estudiante alcanza la respuesta correcta antes de la quinta interacción, termina inmediatamente el proceso. Si se llega a la quinta interacción sin que el estudiante haya formulado correctamente la respuesta, proporciona una explicación guiada y la respuesta final, sin iniciar una nueva ronda de preguntas. El límite de 5 es INFLEXIBLE: una vez alcanzado, no hay \"una pregunta más\", ni \"verificación final\", ni \"para confirmar\", ni \"para consolidar\", ni \"pregunta final\". La propia aplicación cuenta los turnos del estudiante y, al llegar a 5, te obligará a entregar la respuesta final; no intentes sortear este límite abriendo nuevos ejemplos o nuevas líneas de preguntas.\n\n    ### Progresión obligatoria\n    Cada nueva pregunta debe ser más específica que la anterior. No repitas preguntas con otras palabras. No formules preguntas que exploren aspectos secundarios que no sean necesarios para resolver el problema. No preguntes simplemente \"¿qué más?\", \"¿por qué?\" o \"¿qué piensas?\" si esa pregunta no aporta un avance concreto. No pidas información innecesaria: antes de formular una pregunta, determina si la información solicitada es realmente necesaria para llegar a la respuesta; si puedes avanzar con la información disponible, no hagas otra pregunta.\n\n    ### Detectar rápidamente el nivel del estudiante\n    Si el estudiante demuestra que comprende un concepto, no vuelvas a evaluarlo. Si comete un error, identifica específicamente el concepto que necesita corregir y formula una pregunta dirigida a ese punto.\n\n    ### Preguntas con propósito\n    Cada pregunta debe cumplir una de estas funciones:\n    - Identificar el concepto relevante.\n    - Recuperar un conocimiento necesario.\n    - Detectar un error conceptual.\n    - Relacionar datos con el concepto.\n    - Guiar hacia la conclusión.\n    Si una pregunta no cumple ninguna de estas funciones, no la hagas.\n\n    ### Escalamiento de ayuda\n    Utiliza progresivamente:\n    - Nivel 1: pregunta abierta y orientadora.\n    - Nivel 2: pista conceptual.\n    - Nivel 3: pista más específica.\n    - Nivel 4: planteamiento casi resuelto para que el estudiante complete la conclusión.\n    - Nivel 5: explicación breve + respuesta final.\n\n    ### No bloquear al estudiante\n    Si el estudiante dice \"no sé\", no vuelvas a preguntar lo mismo: proporciona una pista concreta y continúa. Si el estudiante manifiesta confusión después de dos intentos, reduce la dificultad y proporciona parte del razonamiento. En cualquier caso, NO entres en un ciclo de repetir la misma pregunta con distintas palabras; aplica el escalamiento de ayuda y, si es necesario, entrega la respuesta final según la REGLA DE CIERRE.\n\n    ### Respuesta final obligatoria\n    El tutor siempre debe llegar a una conclusión. Nunca terminar una conversación con frases como \"¿Qué crees que sigue?\", \"¿Quieres intentarlo de nuevo?\", \"¿Qué opinas?\" o \"¿Puedes explicarlo con tus palabras?\" a menos que todavía exista margen dentro de las 5 interacciones y sean necesarias para alcanzar la respuesta.\n\n    ### Cuando la respuesta ya está clara\n    \"Esencialmente correcta\" significa que la afirmación del estudiante es MATEMÁTICA O FÁCTICAMENTE VERDADERA, no solo plausible o bien redactada. Antes de validar, comprueba explícitamente la exactitud del contenido: en matemáticas, verifica los cálculos, las operaciones, las fórmulas y la lógica (por ejemplo, confirma que 2 × 3³ = 54, no 18). Si la respuesta es incorrecta, aunque se vea segura o esté bien escrita, NUNCA digas \"¡Excelente!\", \"¡Perfecto!\" ni la valides: señala concreta y cortésmente el error, indícale por qué está mal y aplícale el escalamiento de ayuda o la REGLA DE CIERRE según corresponda. Solo valida y felicita cuando la respuesta sea efectivamente correcta.\n\n    ### Rigor en la verificación de respuestas\n    En preguntas de matemáticas y ciencias, nunca elogies una respuesta sin haber verificado su exactitud. Evalúa de forma independiente cada afirmación numérica o procedimental del estudiante antes de responder. Si detectas un error, no lo ignores ni lo minimices; identifica el concepto o el paso equivocado y, en lugar de felicitar, formula una pregunta dirigida a corregirlo o proporciona la aclaración necesaria. La cortesía nunca debe sustituir la corrección académica.\n\n    ### Evita el bucle de \"verificación final\"\n    Es MUY frecuente y ERRÓNEO caer en un bucle en el que, tras el estudiante haber respondido correctamente, sigues preguntando \"una verificación más\", \"para confirmar\", \"para cerrar\", \"para dejarlo perfectamente claro\" o \"solo una última cosa\". PROHIBIDO. Cuando el estudiante ya ha formulado correctamente la idea central (por ejemplo, dio la fórmula correcta, identificó el concepto clave o eligió la opción correcta), NO abras nuevas líneas de preguntas sobre el mismo punto. Valida, sintetiza brevemente lo aprendido y TERMINA la interacción. Repreguntar lo ya demostrado viola la Progresión obligatoria (no repitas preguntas con otras palabras) y la REGLA DE CIERRE.\n\n    ### REGLA DE CIERRE\n    Nunca prolongues una conversación únicamente para mantener el método socrático. El método socrático es un medio, no el objetivo. Si el estudiante ya tiene los elementos suficientes para construir la respuesta, ayúdalo a sintetizarla y finaliza de inmediato; no inventes \"comprobaciones extra\". Como máximo, realiza 5 interacciones pedagógicas. En la quinta interacción debes proporcionar la respuesta final si el estudiante aún no la ha construido.";
    const PROPOSED_QUESTIONS = ["¿Cuál es la idea central de «Estilos artísticos»?","Explica los conceptos fundamentales de «Estilos artísticos».","¿Qué términos importantes debo conocer sobre «Estilos artísticos»?","¿Cómo se aplica «Estilos artísticos» en una situación real?","¿Cuáles son los errores frecuentes al estudiar «Estilos artísticos»?","Propón un ejercicio introductorio sobre «Estilos artísticos».","¿Qué relación tiene «Estilos artísticos» con otros conceptos?","Explica «Estilos artísticos» con un ejemplo sencillo.","¿Qué preguntas debería hacerme para comprender «Estilos artísticos»?","¿Cómo puedo comprobar si entendí «Estilos artísticos»?","Propón un mapa mental sobre «Estilos artísticos».","¿Cómo puedo profundizar mi aprendizaje de «Estilos artísticos»?"];
    const BOT_AVATAR = "";
    const USER_AVATAR = "";

    let pdf2Text = PDF2_TEXT_EMBEDDED;
    let pdf2Name = PDF2_NAME_EMBEDDED;
    let isProcessing = false;
    let chatHistory = [];

    const chatDisplay = document.getElementById('chat-display');
    const questionInput = document.getElementById('question-input');
    const sendButton = document.getElementById('send-button');
    const sendButtonText = document.getElementById('send-button-text');
    const loadingSpinner = document.getElementById('loading-spinner');
    const themeBtn = document.getElementById('theme-btn');
    const pdf2Upload = document.getElementById('pdf2-upload');
    const pdf2NameDisplay = document.getElementById('pdf2-name');
    const pdf2StatusDisplay = document.getElementById('pdf2-status');
    const questionsSelector = document.getElementById('questions-selector');

    const API_BASE = 'https://node.proyectodescartes.org/api/ia';
    function getAvatarUrl(type) {
        if (type === 'bot' && BOT_AVATAR) return BOT_AVATAR;
        if (type === 'user' && USER_AVATAR) return USER_AVATAR;
        const fallbackSvg = function(letter) {
            return 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#6c757d"/><text x="50" y="68" text-anchor="middle" fill="#fff" font-size="44" font-family="system-ui,sans-serif">' + letter + '</text></svg>');
        };
        return type === 'bot' ? fallbackSvg('B') : fallbackSvg('U');
    }

    PROPOSED_QUESTIONS.forEach(function(q, i) {
        const opt = document.createElement('option');
        opt.value = String(i);
        const label = q.length > 72 ? q.substring(0, 69) + '...' : q;
        opt.textContent = label;
        opt.title = q;
        questionsSelector.appendChild(opt);
    });
    questionsSelector.addEventListener('change', function(e) {
        const v = e.target.value;
        if (v !== '') {
            questionInput.value = PROPOSED_QUESTIONS[Number(v)];
            questionInput.focus();
            questionsSelector.value = '';
        }
    });

    // Theme
    function applyTheme(t) { document.body.classList.toggle('dark-mode', t==='dark'); themeBtn.textContent = t==='dark' ? '☀️ Tema' : '🌙 Tema'; }
    themeBtn.addEventListener('click', () => { const n = document.body.classList.contains('dark-mode') ? 'light' : 'dark'; applyTheme(n); localStorage.setItem('theme',n); });
    applyTheme(localStorage.getItem('theme') || 'light');

    function dismissThinkingAsSystem(text, asError) {
        const el = document.getElementById('thinking-msg');
        if (!el) return;
        el.className = 'system-message' + (asError ? ' error' : '');
        el.textContent = text;
        el.removeAttribute('id');
    }

    function cloneNearBottom() {
        return chatDisplay.scrollHeight - chatDisplay.scrollTop - chatDisplay.clientHeight < 90;
    }
    function cloneAutoScroll() {
        if (cloneNearBottom()) chatDisplay.scrollTop = chatDisplay.scrollHeight;
    }
    function cloneTypeInto(el, fullText) {
        return new Promise(function(resolve) {
            el.textContent = '';
            let i = 0;
            const step = 2;
            const delay = 8;
            const tick = function() {
                i += step;
                if (i >= fullText.length) { el.textContent = fullText; resolve(); return; }
                el.textContent = fullText.substring(0, i);
                cloneAutoScroll();
                setTimeout(tick, delay);
            };
            setTimeout(tick, 0);
        });
    }

    function addMsg(message, sender, isThinking = false) {
        const el = document.createElement('div');
        el.classList.add(sender === 'user' ? 'user-message' : sender.includes('system') ? 'system-message' : 'bot-message');
        if (sender.includes('error')) el.classList.add('error');
        if (sender === 'bot' && !isThinking) {
            const processedMessage = message.replace(/\[/g, '\\[').replace(/\]/g, '\\]').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
            const html = marked.parse ? marked.parse(processedMessage) : processedMessage;
            const botAvatarUrl = getAvatarUrl('bot');
            el.innerHTML = '<div class="message"><img class="avatar-img" src="' + botAvatarUrl + '" alt=""><div class="message-bubble bot-bubble"><strong>Chatbot:</strong><div class="tex2jax_process" style="margin-top:5px;">' + html + '</div><div style="margin-top:10px;font-size:.8em;color:var(--secondary);font-style:italic;">Modelo: ' + MODEL + '</div></div></div>';
            if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]).catch(err => console.error(err));
        } else if (sender === 'bot') {
            const botAvatarUrl = getAvatarUrl('bot');
            el.innerHTML = '<div class="message"><img class="avatar-img" src="' + botAvatarUrl + '" alt=""><div class="message-bubble bot-bubble"><strong>Chatbot:</strong> <span class="thinking-animation">' + message + '</span></div></div>';
            el.id = 'thinking-msg';
        } else if (sender === 'user') {
            const userAvatarUrl = getAvatarUrl('user');
            el.innerHTML = '<div class="message user-message"><div class="message-bubble user-bubble"></div><img class="avatar-img" src="' + userAvatarUrl + '" alt=""></div>';
            el.querySelector('.user-bubble').textContent = message;
        } else {
            el.textContent = message;
        }
        chatDisplay.appendChild(el); chatDisplay.scrollTop = chatDisplay.scrollHeight;
    }
    function updateLastMsg(message) {
        const el = document.getElementById('thinking-msg');
        const botAvatarUrl = getAvatarUrl('bot');
        if (el) {
            el.removeAttribute('id');
            el.className = 'bot-message';
            el.innerHTML = '<div class="message"><img class="avatar-img" src="' + botAvatarUrl + '" alt=""><div class="message-bubble bot-bubble"><strong>Chatbot:</strong><div class="tex2jax_process" style="margin-top:5px;"></div><div style="margin-top:10px;font-size:.8em;color:var(--secondary);font-style:italic;">Modelo: ' + MODEL + '</div></div></div>';
            const contentDiv = el.querySelector('.tex2jax_process');
            cloneTypeInto(contentDiv, message).then(function() {
                const processedMessage = message.replace(/\[/g, '\\[').replace(/\]/g, '\\]').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
                const html = marked.parse ? marked.parse(processedMessage) : processedMessage;
                contentDiv.innerHTML = html;
                cloneAutoScroll();
                if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]).catch(err => console.error(err));
            });
        } else {
            addMsg(message, 'bot');
        }
        cloneAutoScroll();
    }

    async function sendQuestion() {
        const question = questionInput.value.trim();
        if (!question || isProcessing) return;
        addMsg(question, 'user'); questionInput.value = '';
        isProcessing = true; sendButton.disabled = true; questionInput.disabled = true;
        loadingSpinner.style.display = 'inline-block'; sendButtonText.textContent = 'Enviando';
        addMsg('Pensando...', 'bot', true);
const systemInstructions = 'Eres un tutor educativo que SOLO debe ayudar con preguntas relacionadas con el tema «' + CHATBOT_THEME + '» usando tu conocimiento incorporado. No dependes de documentos externos ni debes solicitar un PDF. ' +
            'No respondas temas claramente ajenos (vida personal sin relación, otros materiales, programación arbitraria sin vinculación al tema, etc.). ' +
            'Si la pregunta NO tiene relación con el tema, responde ÚNICAMENTE una línea que empiece exactamente con [FUERA_DE_ALCANCE] seguida de una frase breve en español. ' +
            'Para preguntas válidas, fundamenta la respuesta en conocimientos académicos confiables y actúa siempre como tutor educativo.' +
            '\n\n' + SYS_TUTOR_EMBEDDED +
            '\n\n(Instrucción: Para expresiones matemáticas, utiliza SÓLO el formato $$...$$ para bloque y $...$ para texto en línea.)\n\n' +
            'El tema de estudio seleccionado es «' + CHATBOT_THEME + '». Usa tu conocimiento incorporado sobre este tema como base de conocimiento.';
        let conversationText = '';
        chatHistory.forEach(function(m) {
            if (m.role === 'user') conversationText += 'Usuario: ' + m.content + '\n';
            else if (m.role === 'assistant') conversationText += 'Chatbot: ' + m.content + '\n';
        });
        conversationText += 'Usuario: ' + question;
        chatHistory.push({ role: 'user', content: question });
        var userTurns = chatHistory.filter(function(m){ return m.role === 'user'; }).length;
        var capInstruction = '';
        if (userTurns >= 5) {
            capInstruction = '\n\n[CONTROL DE LA APLICACIÓN] Se alcanzó el LÍMITE MÁXIMO de 5 interacciones pedagógicas. NO formules ninguna pregunta más. Entrega AHORA MISMO la respuesta final completa y razonada, sintetizando lo aprendido. Esta es tu última intervención.';
        }
        const fullPrompt = systemInstructions + '\n\n=== DIALOGO CON EL ESTUDIANTE ===\n' + conversationText +
            capInstruction +
            '\n\nInstrucción final: NO resuelvas el ejercicio directamente ni entregues la solución completa en tu primera respuesta. Aplica el método socrático descrito arriba: analiza, divide el razonamiento en pasos pequeños y haz preguntas guiadas una por una. Espera la respuesta del estudiante antes de avanzar.';
        try {
            const res = await fetch(API_BASE + '/text', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    prompt: fullPrompt,
                    model: MODEL,
                    system: systemInstructions
                })
            });
            if (!res.ok) { let e=''; try{e=await res.text();}catch(_){} throw new Error('Error de API: ' + res.status + ' ' + res.statusText + '. ' + e.substring(0,200)); }
            let raw = (await res.text()).trim();
            try {
                const parsed = JSON.parse(raw);
                if (parsed && typeof parsed === 'object') raw = String(parsed.text || parsed.output || parsed.response || parsed.content || raw).trim();
            } catch(_) {}
            if (/^\[FUERA_DE_ALCANCE\]/.test(raw)) {
                chatHistory.push({ role: 'assistant', content: raw });
                dismissThinkingAsSystem(raw.replace(/^\[FUERA_DE_ALCANCE\]\s*/, ''), true);
            } else {
                updateLastMsg(raw || 'La IA no proporcionó una respuesta.');
                chatHistory.push({ role: 'assistant', content: raw || 'La IA no proporcionó una respuesta.' });
            }
        } catch(err) { updateLastMsg('Lo siento, ocurrió un error: ' + err.message); }
        finally {
            isProcessing = false; sendButton.disabled = false; questionInput.disabled = false;
            loadingSpinner.style.display = 'none'; sendButtonText.textContent = 'Enviar'; questionInput.focus();
        }
    }
    function escapeHtml(s) {
        if (s === undefined || s === null) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function getSessionHTML() {
        const clone = chatDisplay.cloneNode(true);
        const exportStyles =
            'body{font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;line-height:1.65;padding:28px;color:#333;max-width:880px;margin:0 auto;background:#fafafa;}' +
            'h1{color:#007bff;font-size:1.45em;margin-bottom:6px;}' +
            '.meta{color:#444;margin:6px 0;font-size:.95em;}' +
            'hr{border:none;border-top:1px solid #dee2e6;margin:22px 0;}' +
            '.chat-export{padding:4px 0;}' +
            '.chat-export .user-message,.chat-export .bot-message,.chat-export .system-message{margin-bottom:18px;}' +
            '.chat-export .system-message{text-align:center;color:#555;font-style:italic;padding:10px 14px;background:#fff3cd;border-radius:10px;border:1px solid #ffeaa7;}' +
            '.chat-export .system-message.error{background:#f8d7da;color:#721c24;border-color:#f5c6cb;}' +
            '.chat-export .message{display:flex;align-items:flex-end;gap:12px;}' +
            '.chat-export .message.user-message{flex-direction:row-reverse;}' +
            '.chat-export .avatar-img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid #e0e0e0;}' +
            '.chat-export .message-bubble{padding:12px 16px;border-radius:18px;max-width:78%;box-shadow:0 1px 2px rgba(0,0,0,.06);}' +
            '.chat-export .user-bubble{background:#007bff;color:#fff;}' +
            '.chat-export .bot-bubble{background:#e9ecef;color:#212529;}' +
            '.chat-export .bot-bubble strong{color:#007bff;}' +
            '.chat-export .bot-bubble p{margin:0 0 10px;}.chat-export .bot-bubble p:last-child{margin:0;}' +
            '.chat-export pre{background:#2d2d2d;color:#f8f8f2;padding:12px;border-radius:8px;overflow-x:auto;font-size:.9em;}' +
            '.chat-export code{background:#eee;padding:2px 6px;border-radius:4px;font-size:.9em;}' +
            '.chat-export ul,.chat-export ol{margin:8px 0;padding-left:22px;}';
        return '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sesión de chat</title><style>' + exportStyles + '</style></head><body>' +
            '<h1>Sesión de chat</h1>' +
            '<p class="meta"><strong>Documento:</strong> ' + escapeHtml(PDF_NAME) + '</p>' +
            '<p class="meta"><strong>Tema del chatbot:</strong> ' + escapeHtml(CHATBOT_THEME) + '</p>' +
            '<p class="meta"><strong>Modelo:</strong> ' + escapeHtml(MODEL) + '</p>' +
            '<hr><div class="chat-export">' + clone.innerHTML + '</div></body></html>';
    }

    function downloadSessionHtml() {
        const blob = new Blob([getSessionHTML()], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Sesion_Chat_' + Date.now() + '.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function processHtmlToDocx(htmlContent) {
        const paragraphs = [];
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = htmlContent;
        const elements = tempDiv.children;
        if (elements.length === 0 && htmlContent.replace(/\s/g, '').length > 0) {
            return [new docx.Paragraph({ text: tempDiv.textContent || htmlContent, spacing: { after: 200 } })];
        }
        for (let i = 0; i < elements.length; i++) {
            const element = elements[i];
            const tagName = element.tagName.toLowerCase();
            const text = element.textContent || element.innerText || '';
            if (tagName === 'h1' || tagName === 'h2') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: tagName === 'h1' ? docx.HeadingLevel.HEADING_1 : docx.HeadingLevel.HEADING_2,
                    spacing: { before: 400, after: 200 }
                }));
            } else if (tagName === 'h3') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: docx.HeadingLevel.HEADING_3,
                    spacing: { before: 300, after: 200 }
                }));
            } else if (tagName === 'ul' || tagName === 'ol') {
                const listItems = element.querySelectorAll('li');
                listItems.forEach(function(li) {
                    paragraphs.push(new docx.Paragraph({
                        text: li.textContent,
                        bullet: { level: 0 },
                        spacing: { after: 100 }
                    }));
                });
            } else if (tagName === 'p') {
                const textRuns = [];
                if (element.children.length === 0) {
                    textRuns.push(new docx.TextRun({ text: text }));
                } else {
                    processInlineElements(element, textRuns);
                }
                paragraphs.push(new docx.Paragraph({
                    children: textRuns.length > 0 ? textRuns : [new docx.TextRun({ text: text })],
                    spacing: { after: 200 }
                }));
            } else if (tagName === 'blockquote') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    italics: true,
                    indent: { left: 720 },
                    spacing: { after: 200 },
                    border: { left: { color: 'CCCCCC', size: 6, style: docx.BorderStyle.SINGLE } }
                }));
            } else if (tagName === 'code') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: 'F5F5F5' },
                    spacing: { after: 100 }
                }));
            } else if (tagName === 'pre') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: '2D2D2D' },
                    color: 'FFFFFF',
                    spacing: { after: 200 }
                }));
            } else {
                paragraphs.push(new docx.Paragraph({ text: text, spacing: { after: 200 } }));
            }
        }
        return paragraphs;
    }

    function processInlineElements(element, textRuns) {
        for (let j = 0; j < element.childNodes.length; j++) {
            const node = element.childNodes[j];
            if (node.nodeType === Node.TEXT_NODE) {
                textRuns.push(new docx.TextRun({ text: node.textContent }));
            } else if (node.nodeType === Node.ELEMENT_NODE) {
                const tagName = node.tagName.toLowerCase();
                const nodeText = node.textContent || '';
                if (tagName === 'strong' || tagName === 'b') {
                    textRuns.push(new docx.TextRun({ text: nodeText, bold: true }));
                } else if (tagName === 'em' || tagName === 'i') {
                    textRuns.push(new docx.TextRun({ text: nodeText, italics: true }));
                } else if (tagName === 'u') {
                    textRuns.push(new docx.TextRun({ text: nodeText, underline: {} }));
                } else if (tagName === 'code') {
                    textRuns.push(new docx.TextRun({
                        text: nodeText,
                        font: 'Courier New',
                        shading: { type: docx.ShadingType.SOLID, color: 'F0F0F0' }
                    }));
                } else if (tagName === 'a') {
                    textRuns.push(new docx.TextRun({ text: nodeText, color: '0066CC', underline: {} }));
                } else {
                    processInlineElements(node, textRuns);
                }
            }
        }
    }

    function downloadSessionWord() {
        if (typeof docx === 'undefined' || typeof saveAs === 'undefined') {
            alert('Las librerías para exportar Word aún se están cargando. Espera unos segundos e inténtalo de nuevo.');
            return;
        }
        const chatMessages = chatDisplay.querySelectorAll('.user-message, .bot-message, .system-message');
        const children = [];
        children.push(new docx.Paragraph({
            text: 'Sesión de Chat (documento PDF)',
            heading: docx.HeadingLevel.HEADING_1,
            alignment: docx.AlignmentType.CENTER,
            spacing: { after: 400 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Documento: ', bold: true }),
                new docx.TextRun({ text: PDF_NAME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Tema del chatbot: ', bold: true }),
                new docx.TextRun({ text: CHATBOT_THEME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Modelo: ', bold: true }),
                new docx.TextRun({ text: MODEL })
            ],
            spacing: { after: 200 }
        }));
        children.push(new docx.Paragraph({
            text: '________________________________________________________________________________________________',
            spacing: { after: 400 }
        }));

        chatMessages.forEach(function(msg) {
            if (msg.classList.contains('system-message')) {
                children.push(new docx.Paragraph({
                    text: msg.textContent,
                    italics: true,
                    alignment: docx.AlignmentType.CENTER,
                    spacing: { after: 200 },
                    color: '666666'
                }));
            } else if (msg.classList.contains('user-message')) {
                const ub = msg.querySelector('.user-bubble');
                const userText = ub ? ub.textContent.trim() : msg.textContent.replace(/^Usuario:\s*/i, '').trim();
                children.push(new docx.Paragraph({
                    children: [
                        new docx.TextRun({ text: 'Usuario: ', bold: true, color: '0066CC' }),
                        new docx.TextRun({ text: userText })
                    ],
                    spacing: { after: 200 },
                    alignment: docx.AlignmentType.RIGHT,
                    shading: { type: docx.ShadingType.SOLID, color: 'E3F2FD' }
                }));
            } else if (msg.classList.contains('bot-message')) {
                const botBubble = msg.querySelector('.message-bubble');
                if (botBubble) {
                    const contentDiv = botBubble.querySelector('.tex2jax_process') || botBubble.querySelector('div[style*="margin-top:5px"]');
                    const modelInfoEl = botBubble.querySelector('div[style*="font-size:0.8em"]');
                    const modelInfo = modelInfoEl ? modelInfoEl.textContent : '';
                    if (contentDiv) {
                        const formatted = processHtmlToDocx(contentDiv.innerHTML);
                        formatted.forEach(function(paragraph) { children.push(paragraph); });
                        if (modelInfo) {
                            children.push(new docx.Paragraph({
                                children: [new docx.TextRun({ text: modelInfo, italics: true, size: 20, color: '666666' })],
                                spacing: { after: 200 }
                            }));
                        }
                    } else {
                        let plain = botBubble.textContent || '';
                        if (modelInfo) plain = plain.split(modelInfo).join('').trim();
                        plain = plain.replace(/^Chatbot:\s*/i, '').trim();
                        children.push(new docx.Paragraph({ text: plain, spacing: { after: 200 } }));
                    }
                }
            }
        });

        const doc = new docx.Document({
            sections: [{ properties: {}, children: children }]
        });
        docx.Packer.toBlob(doc).then(function(blob) {
            saveAs(blob, 'Sesion_Chat_' + Date.now() + '.docx');
        });
    }

    sendButton.addEventListener('click', sendQuestion);
    questionInput.addEventListener('keypress', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); } });
    document.getElementById('download-html-session-btn').addEventListener('click', downloadSessionHtml);
    document.getElementById('download-word-session-btn').addEventListener('click', downloadSessionWord);
    function resetEmbeddedChat() {
        chatHistory = [];
        chatDisplay.innerHTML = '';
        questionInput.value = '';
        addMsg('Listo para ayudarte con el tema «' + CHATBOT_THEME + '» usando mi conocimiento incorporado. ¡Puedes empezar!', 'system');
        questionInput.focus();
    }
    document.getElementById('new-chat-session-btn').addEventListener('click', resetEmbeddedChat);
    addMsg('Listo para ayudarte con el tema «' + CHATBOT_THEME + '» usando mi conocimiento incorporado. ¡Puedes empezar!', 'system');
    questionInput.focus();
</script>
